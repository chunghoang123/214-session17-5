server:
  port: 8081
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always


  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false